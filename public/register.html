<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0f;
      --surface: #131318;
      --border: #222230;
      --accent: #7c6dfa;
      --accent-glow: rgba(124, 109, 250, 0.3);
      --text: #f0eeff;
      --muted: #6b6a80;
      --danger: #ff5a5a;
      --success: #4ade80;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 450px;
      padding: 48px 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      position: relative;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .subtitle a {
      color: var(--accent);
      text-decoration: none;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    input::placeholder { color: var(--muted); }

    button[type="submit"] {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    button[type="submit"]:hover { opacity: 0.88; transform: translateY(-1px); }
    button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #message {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
      text-align: center;
      border-radius: 8px;
      padding: 0;
      transition: all 0.2s;
    }

    #message.error {
      color: var(--danger);
      background: rgba(255,90,90,0.08);
      padding: 10px;
    }

    #message.success {
      color: var(--success);
      background: rgba(74,222,128,0.08);
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Створити акаунт</h1>
    <p class="subtitle">Вже є акаунт? <a href="http://localhost:5501/login.html">Увійти</a></p>

    <form id="registerForm" novalidate>
      <div class="field">
        <label>Ім'я</label>
        <input type="text" id="name" placeholder="Ваше ім'я" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="Мін. 8 символів" required>
      </div>
      <div class="field">
        <label>Підтвердіть пароль</label>
        <input type="password" id="confirmPassword" placeholder="Повторіть пароль" required>
      </div>
      <button type="submit" id="submitBtn">Зареєструватися</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';
 
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');
      btn.disabled = true;
      btn.textContent = 'Зачекайте...';
      msg.className = '';
      msg.textContent = '';
 
      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value,
      };
 
      const response = await fetch(`${API_URL}/api/auth/register`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
 
      const data = await response.json();
 
      if (!response.ok) {
        msg.className = 'error';
        msg.textContent = data.error?.message || data.message || 'Помилка реєстрації';
        btn.disabled = false;
        btn.textContent = 'Зареєструватися';
        return;
      }
 
      msg.className = 'success';
      setTimeout(() => window.location.href = 'http://localhost:5501/index.html', 1000);
    });
  </script>
</body>
</html>
